<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gold gradient for tech elements -->
        <linearGradient id="goldGradientTech" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="50%" stop-color="#DAA520"/>
            <stop offset="100%" stop-color="#B8860B"/>
        </linearGradient>
        <!-- Glow filter for tech elements -->
        <filter id="techGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
            <feFlood flood-color="#FFD700" flood-opacity="0.7" result="flood"/>
            <feComposite in="flood" in2="blur" operator="in" result="glow"/>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background grid/circuit pattern with subtle animation -->
    <rect x="0" y="0" width="400" height="300" fill="#1A202C"/>
    <g opacity="0.1">
        <rect x="0" y="0" width="400" height="300" fill="url(#goldGradientTech)" mask="url(#gridMask)"/>
        <mask id="gridMask">
            <rect x="0" y="0" width="400" height="300" fill="white"/>
            <path d="M0 0 L400 300 M0 300 L400 0" stroke="black" stroke-width="1"/>
            <path d="M0 100 L400 100 M0 200 L400 200 M100 0 L100 300 M200 0 L200 300 M300 0 L300 300" stroke="black" stroke-width="0.5"/>
            <animate attributeName="opacity" values="0.1;0.2;0.1" dur="10s" repeatCount="indefinite"/>
        </mask>
    </g>

    <!-- Central glowing tech hub -->
    <circle cx="200" cy="150" r="60" fill="url(#goldGradientTech)" filter="url(#techGlow)">
        <animate attributeName="r" values="60;65;60" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating Code Blocks / Data Streams -->
    <text x="100" y="80" font-family="monospace" font-size="14" fill="#FFD700" filter="url(#techGlow)" opacity="0">
        <tspan dy="-0.5em">&lt;code&gt;</tspan>
        <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" begin="1s"/>
        <animateMotion path="M0 0 C 20 20, -20 40, 0 60" dur="5s" repeatCount="indefinite" additive="sum"/>
    </text>
    <text x="300" y="120" font-family="monospace" font-size="14" fill="#DAA520" filter="url(#techGlow)" opacity="0">
        <tspan dy="-0.5em">{ data }</tspan>
        <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" begin="2.5s"/>
        <animateMotion path="M0 0 C -20 -20, 20 -40, 0 -60" dur="5s" repeatCount="indefinite" additive="sum"/>
    </text>
    <text x="150" y="220" font-family="monospace" font-size="14" fill="#B8860B" filter="url(#techGlow)" opacity="0">
        <tspan dy="-0.5em">AI.learn()</tspan>
        <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" begin="4s"/>
        <animateMotion path="M0 0 C 10 -30, -10 -20, 0 0" dur="5s" repeatCount="indefinite" additive="sum"/>
    </text>

    <!-- Interconnecting Lines / Circuits -->
    <path d="M50 50 Q 200 0, 350 50 T 200 150 Q 50 200, 50 150 Q 150 100, 200 150 Z" stroke="url(#goldGradientTech)" stroke-width="2" fill="none" opacity="0.5">
        <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- Abstract gear/cog elements -->
    <g transform="translate(80, 250) scale(0.7)" fill="url(#goldGradientTech)" filter="url(#techGlow)">
        <path d="M20 0 A20 20 0 0 1 10 17.32 L0 0 L10 -17.32 A20 20 0 0 1 20 0 Z"/>
        <path d="M-20 0 A20 20 0 0 0 -10 -17.32 L0 0 L-10 17.32 A20 20 0 0 0 -20 0 Z" transform="rotate(30)"/>
        <circle cx="0" cy="0" r="5" fill="#FFF"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g transform="translate(320, 50) scale(0.6)" fill="url(#goldGradientTech)" filter="url(#techGlow)">
        <path d="M20 0 A20 20 0 0 1 10 17.32 L0 0 L10 -17.32 A20 20 0 0 1 20 0 Z"/>
        <path d="M-20 0 A20 20 0 0 0 -10 -17.32 L0 0 L-10 17.32 A20 20 0 0 0 -20 0 Z" transform="rotate(30)"/>
        <circle cx="0" cy="0" r="5" fill="#FFF"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="10s" repeatCount="indefinite" additive="sum"/>
    </g>

    <!-- Animated glowing particles -->
    <circle cx="20" cy="20" r="2" fill="#FFFFFF" opacity="0">
        <animateMotion path="M 20 20 C 100 0, 150 50, 200 100 C 250 150, 300 200, 380 280" dur="7s" repeatCount="indefinite" rotate="auto"/>
        <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="280" r="3" fill="#FFFFFF" opacity="0">
        <animateMotion path="M 380 280 C 300 300, 250 250, 200 200 C 150 150, 100 100, 20 20" dur="9s" repeatCount="indefinite" rotate="auto" begin="2s"/>
        <animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite" begin="2s"/>
    </circle>

</svg>



