<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="20" width="360" height="210" rx="25" fill="#684EC6" fill-opacity="0.1" stroke="#684EC6" stroke-width="2" stroke-dasharray="10 5">
        <animate attributeName="stroke-dashoffset" from="0" to="100" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Central pulsating orb -->
    <circle cx="200" cy="125" r="40" fill="#7BB5EA">
        <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite" begin="0s"/>
        <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite" begin="0s"/>
    </circle>

    <!-- Small orbiting elements -->
    <circle cx="200" cy="125" r="5" fill="#F37DB5">
        <animateMotion path="M 0 0 L 80 0 A 80 40 0 0 1 0 0 Z" dur="4s" repeatCount="indefinite" rotate="auto"/>
        <animate attributeName="fill" values="#F37DB5;#FFD700;#F37DB5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="125" r="5" fill="#FFD700">
        <animateMotion path="M 0 0 L -80 0 A 80 40 0 0 0 0 0 Z" dur="4s" repeatCount="indefinite" rotate="auto" begin="2s"/>
        <animate attributeName="fill" values="#FFD700;#F37DB5;#FFD700" dur="4s" repeatCount="indefinite" begin="2s"/>
    </circle>

    <!-- Text elements -->
    <text x="200" y="80" font-family="Segoe UI" font-size="20" fill="#684EC6" text-anchor="middle" font-weight="bold">
        <tspan dy="-0.5em">Innovation</tspan>
        <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" begin="1s"/>
    </text>
    <text x="200" y="130" font-family="Segoe UI" font-size="20" fill="#7BB5EA" text-anchor="middle" font-weight="bold">
        <tspan dy="-0.5em">Community</tspan>
        <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" begin="2.5s"/>
    </text>
    <text x="200" y="180" font-family="Segoe UI" font-size="20" fill="#F37DB5" text-anchor="middle" font-weight="bold">
        <tspan dy="-0.5em">Growth</tspan>
        <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" begin="4s"/>
    </text>

    <!-- Subtle background waves -->
    <path d="M0 250 C 100 200, 300 200, 400 250 L 400 250 L 0 250 Z" fill="#8EC4F8" fill-opacity="0.1">
        <animate attributeName="d" values="M0 250 C 100 200, 300 200, 400 250 L 400 250 L 0 250 Z; M0 250 C 100 210, 300 210, 400 250 L 400 250 L 0 250 Z; M0 250 C 100 200, 300 200, 400 250 L 400 250 L 0 250 Z" dur="6s" repeatCount="indefinite"/>
    </path>
</svg>



