<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="goldGrowthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="30%" stop-color="#DAA520"/>
            <stop offset="60%" stop-color="#B8860B"/>
            <stop offset="100%" stop-color="#FFD700"/>
        </linearGradient>
        <filter id="growthGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
            <feFlood flood-color="#FFD700" flood-opacity="0.7" result="flood"/>
            <feComposite in="flood" in2="blur" operator="in" result="glow"/>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Deep space background -->
    <rect x="0" y="0" width="400" height="300" fill="#0A0A1A"/>

    <!-- Subtle background nebula (dark purple for blending) -->
    <circle cx="70" cy="200" r="40" fill="#101020" opacity="0.2">
        <animate attributeName="cx" values="70;90;70" dur="25s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="200;180;200" dur="27s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="80" r="50" fill="#101020" opacity="0.2">
        <animate attributeName="cx" values="330;310;330" dur="28s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;100;80" dur="26s" repeatCount="indefinite"/>
    </circle>

    <!-- Central Growing Tree/Network -->
    <g transform="translate(200, 250)" filter="url(#growthGlow)">
        <!-- Main trunk / central pillar -->
        <rect x="-10" y="-100" width="20" height="100" fill="url(#goldGrowthGradient)" transform="scale(1,0)">
            <animate attributeName="transform" type="scale" values="1,0;1,1" dur="2s" fill="freeze"/>
        </rect>

        <!-- Branching lines (representing growth paths) -->
        <path d="M0 -100 L-80 -180" stroke="url(#goldGrowthGradient)" stroke-width="2" opacity="0">
            <animate attributeName="opacity" values="0;1" begin="2s" dur="1s" fill="freeze"/>
            <animate attributeName="stroke-dasharray" values="0 150; 150 0" begin="2s" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M0 -100 L80 -180" stroke="url(#goldGrowthGradient)" stroke-width="2" opacity="0">
            <animate attributeName="opacity" values="0;1" begin="2.2s" dur="1s" fill="freeze"/>
            <animate attributeName="stroke-dasharray" values="0 150; 150 0" begin="2.2s" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M-80 -180 L-120 -150" stroke="url(#goldGrowthGradient)" stroke-width="1.5" opacity="0">
            <animate attributeName="opacity" values="0;1" begin="3s" dur="1s" fill="freeze"/>
            <animate attributeName="stroke-dasharray" values="0 80; 80 0" begin="3s" dur="1.5s" repeatCount="indefinite"/>
        </path>
        <path d="M80 -180 L120 -150" stroke="url(#goldGrowthGradient)" stroke-width="1.5" opacity="0">
            <animate attributeName="opacity" values="0;1" begin="3.2s" dur="1s" fill="freeze"/>
            <animate attributeName="stroke-dasharray" values="0 80; 80 0" begin="3.2s" dur="1.5s" repeatCount="indefinite"/>
        </path>

        <!-- Glowing nodes at ends of branches -->
        <circle cx="-80" cy="-180" r="5" fill="url(#goldGrowthGradient)" opacity="0">
            <animate attributeName="opacity" values="0;1;0" begin="3s" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="80" cy="-180" r="5" fill="url(#goldGrowthGradient)" opacity="0">
            <animate attributeName="opacity" values="0;1;0" begin="3.3s" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-120" cy="-150" r="4" fill="url(#goldGrowthGradient)" opacity="0">
            <animate attributeName="opacity" values="0;1;0" begin="3.6s" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="120" cy="-150" r="4" fill="url(#goldGrowthGradient)" opacity="0">
            <animate attributeName="opacity" values="0;1;0" begin="3.9s" dur="3s" repeatCount="indefinite"/>
        </circle>

        <!-- Expanding ripple effect at the base -->
        <circle cx="0" cy="0" r="0" stroke="url(#goldGrowthGradient)" stroke-width="1" fill="none" opacity="0">
            <animate attributeName="r" values="0;100" dur="4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.5;0" dur="4s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Digital Text Overlay for Growth -->
    <text x="200" y="280" font-family="'Share Tech Mono', monospace" font-size="22" fill="#FFD700" text-anchor="middle" filter="url(#growthGlow)" opacity="0.7">
        <tspan>EMPOWERING GROWTH</tspan>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="2.5s" repeatCount="indefinite"/>
    </text>
</svg>

