<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gold gradient for trophies and borders -->
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="50%" stop-color="#DAA520"/>
            <stop offset="100%" stop-color="#B8860B"/>
        </linearGradient>
        <!-- Glow filter for prestige effect -->
        <filter id="trophyGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
            <feFlood flood-color="#FFD700" flood-opacity="0.7" result="flood"/>
            <feComposite in="flood" in2="blur" operator="in" result="glow"/>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background for the trophy case -->
    <rect x="20" y="20" width="360" height="260" rx="15" fill="#1A202C" stroke="url(#goldGradient)" stroke-width="3" filter="url(#trophyGlow)">
        <animate attributeName="stroke-dasharray" values="100 0; 0 100; 100 0" dur="10s" repeatCount="indefinite"/>
    </rect>

    <!-- Shelves in the trophy case -->
    <line x1="50" y1="100" x2="350" y2="100" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="8s" repeatCount="indefinite"/>
    </line>
    <line x1="50" y1="180" x2="350" y2="180" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3;0.7;1" dur="8s" repeatCount="indefinite" begin="1s"/>
    </line>

    <!-- Trophies (simplified shapes with glow) -->
    <!-- Trophy 1 (original, slightly moved) -->
    <g transform="translate(80, 70)" filter="url(#trophyGlow)">
        <path d="M-15 0 L15 0 L10 -30 L-10 -30 Z" fill="url(#goldGradient)"/>
        <circle cx="0" cy="-30" r="10" fill="url(#goldGradient)"/>
        <circle cx="0" cy="0" r="20" fill="url(#goldGradient)" opacity="0.8">
            <animate attributeName="r" values="20;22;20" dur="3s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Trophy 2 (original, slightly moved) -->
    <g transform="translate(320, 70)" filter="url(#trophyGlow)">
        <rect x="-15" y="-30" width="30" height="30" fill="url(#goldGradient)"/>
        <polygon points="-20 0, 20 0, 10 30, -10 30" fill="url(#goldGradient)" opacity="0.8">
            <animate attributeName="transform" type="scale" values="1 1; 1.1 1.1; 1 1" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
        </polygon>
    </g>

    <!-- New Trophy 3 (center top) -->
    <g transform="translate(200, 75)" filter="url(#trophyGlow)">
        <rect x="-12" y="-35" width="24" height="35" fill="url(#goldGradient)"/>
        <path d="M-20 -35 L20 -35 L10 -50 L-10 -50 Z" fill="url(#goldGradient)" opacity="0.9">
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="2.2s" repeatCount="indefinite"/>
        </path>
    </g>

    <!-- New Trophy 4 (left middle) -->
    <g transform="translate(70, 150)" filter="url(#trophyGlow)">
        <path d="M-10 0 L10 0 L10 -25 L-10 -25 Z" fill="url(#goldGradient)"/>
        <rect x="-15" y="-45" width="30" height="20" fill="url(#goldGradient)" opacity="0.8">
            <animateTransform attributeName="transform" type="rotate" from="0" to="-5" dur="2s" repeatCount="indefinite" additive="sum"/>
        </rect>
    </g>

    <!-- New Trophy 5 (right middle) -->
    <g transform="translate(330, 150)" filter="url(#trophyGlow)">
        <circle cx="0" cy="-15" r="12" fill="url(#goldGradient)"/>
        <path d="M-18 0 Q -5 15 0 15 Q 5 15 18 0 Z" fill="url(#goldGradient)" opacity="0.0">
            <animate attributeName="opacity" values="0.8;0.9;0.8" dur="2.8s" repeatCount="indefinite" begin="1s"/>
        </path>
    </g>

    <!-- New Trophy 6 (center bottom) -->
    <g transform="translate(200, 190)" filter="url(#trophyGlow)">
        <rect x="-25" y="-10" width="50" height="10" fill="url(#goldGradient)"/>
        <path d="M-20 -10 L20 -10 L15 -35 L-15 -35 Z" fill="url(#goldGradient)" opacity="0.9">
            <animateTransform attributeName="transform" type="scale" values="1 1; 1.05 1; 1 1" dur="2.3s" repeatCount="indefinite" begin="0.8s"/>
        </path>
    </g>

    <!-- New Trophy 7 (bottom left) -->
    <g transform="translate(120, 205)" filter="url(#trophyGlow)">
        <circle cx="0" cy="-5" r="10" fill="url(#goldGradient)"/>
        <rect x="-8" y="0" width="16" height="15" fill="url(#goldGradient)" opacity="0.7">
            <animateTransform attributeName="transform" type="rotate" from="0" to="-3" dur="1.8s" repeatCount="indefinite" additive="sum"/>
        </rect>
    </g>

    <!-- New Trophy 8 (bottom right) -->
    <g transform="translate(280, 205)" filter="url(#trophyGlow)">
        <polygon points="-10 0, 10 0, 0 -20" fill="url(#goldGradient)"/>
        <rect x="-12" y="0" width="24" height="15" fill="url(#goldGradient)" opacity="0.7">
            <animateTransform attributeName="transform" type="rotate" from="0" to="3" dur="1.9s" repeatCount="indefinite" additive="sum" begin="0.3s"/>
        </rect>
    </g>

    <!-- Prestige text element -->
    <text x="200" y="260" font-family="Georgia, serif" font-size="24" fill="#FFD700" text-anchor="middle" font-weight="bold" filter="url(#trophyGlow)">
        <tspan>Our Legacy of Excellence</tspan>
        <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite" begin="2s"/>
    </text>

    <!-- Subtle animated sparkles -->
    <circle cx="70" cy="220" r="2" fill="#FFF" opacity="0">
        <animate attributeName="cx" values="70;80;70" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="220;210;220" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="230" r="3" fill="#FFF" opacity="0">
        <animate attributeName="cx" values="330;320;330" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="230;240;230" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </circle>

</svg>
